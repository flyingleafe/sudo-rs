[package]
name = "sudo-rs"
description = "A memory safe implementation of sudo and su."
version = "0.2.15"
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/trifectatechfoundation/sudo-rs"
homepage = "https://trifectatech.org/projects/sudo-rs/"
publish = true
categories = ["command-line-interface"]
exclude = ["audit", "proofs", "util"]

rust-version = "1.85"

default-run = "sudo"

[dependencies]
libc = "0.2.176"
glob = "0.3.0"

[features]
default = []

# when enabled, use "sudo-i" PAM service name for sudo -i instead of "sudo"
# ONLY ENABLE THIS FEATURE if you know that original sudo uses "sudo-i"
# on the system you are building sudo for (e.g. Debian, Fedora, but not Arch)
pam-login = []

# this enables enforcing of AppArmor profiles
apparmor = []

# whether to enable 'gettext' support for giving localized user-facing messages
gettext = []

# whether to enable the unstable '@socket' feature for fetching a remote sudoers
unstable-remote-sudoers = []

# enable detailed logging (use for development only) to /tmp
# this will compromise the security of sudo-rs somewhat
dev = []

# this feature should never be enabled, but it is here to prevent accidental
# compilation using "cargo --all-features", which should not be used on sudo-rs
do-not-use-all-features = []

[profile.release]
strip = "symbols"
lto = true
opt-level = "s"

[lints.rust]
unsafe_op_in_unsafe_fn = { level = "deny" }
# `cfg(fuzzing)` is set by cargo-fuzz (`src/fuzz_api.rs`, see `fuzz/`); `cfg(kani)` marks the
# bounded proof harnesses (proofs/kani). Normal builds set neither.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(kani)"] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"

# Options for Charon (https://github.com/AeneasVerif/charon), which extracts the sudoers
# authorization decision, its mapping to restrictions, the alias order producer, the argument
# escaping of `sudo -s`/`-i`, and the restricted-style sudoers parser: lexical layer, host lists,
# user lists and permission lines (`proofs/parser/RESTYLE.md`), and policy analysis with
# Defaults scoping (`proofs/parser/ANALYSIS.md`).
[package.metadata.charon]
start_from = [
    "crate::sudoers::permission_flags",
    "crate::sudoers::sanitize_alias_tables",
    "crate::sudoers::list_flags",
    "crate::sudoers::validate_flags",
    "crate::sudoers::Judgement::authorization",
    "crate::common::command::escaped",
    "crate::sudoers::basic_parser::parse_lines",
    "crate::sudoers::basic_parser::expect_syntax",
    "crate::sudoers::basic_parser::is_syntax",
    "crate::sudoers::basic_parser::expect_nonterminal",
    "crate::sudoers::basic_parser::parse_list",
    "crate::sudoers::ast::host_list",
    "crate::defaults::SettingsModifier::apply",
    "crate::defaults::set",
    "crate::defaults::negate",
    "crate::defaults::check_integer",
    "crate::defaults::check_text",
    "crate::defaults::build_list",
    "crate::sudoers::ast::user_list",
    "crate::sudoers::ast::expect_user_list",
    "crate::sudoers::ast::permissions",
    "crate::sudoers::ast::parse_sudo_lines",
    "crate::sudoers::analyze",
    "crate::sudoers::analyze_text",
    "crate::sudoers::Sudoers::check",
    "crate::sudoers::Sudoers::check_list_permission",
    "crate::sudoers::Sudoers::check_validate_permission",
    "{impl core::default::Default for crate::defaults::Settings}::default",
    "crate::common::resolve::target_fallback",
    "crate::common::resolve::select_target",
    "crate::common::command::select_command_path",
    "crate::common::resolve::search_path_core",
    "crate::common::resolve::resolve_target_core",
]
opaque = [
    "crate::common::string",
    "crate::sudoers::warn_ignored",
    "crate::sudoers::alias_diagnostic",
    "crate::sudoers::char_stream::chars_of",
    "crate::sudoers::basic_parser::escape_char",
    "crate::sudoers::tokens::sudo_string",
    "crate::sudoers::tokens::sudo_string_text",
    "crate::sudoers::tokens::os_string",
    "crate::sudoers::tokens::canonical",
    "crate::sudoers::tokens::compile_pattern",
    "crate::sudoers::tokens::classify_chdir",
    "crate::sudoers::tokens::sudo_path",
    "crate::sudoers::include_file",
    "crate::sudoers::include_dir_files",
    "crate::sudoers::fatal_message",
]
