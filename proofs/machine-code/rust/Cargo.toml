[package]
name = "sudo-rs-machine-code"
version = "0.1.0"
edition = "2024"
publish = false
# Harness crate for the machine-code proof: the sudo-rs items in `copied/` (verbatim, see
# `../scripts/copy-source.sh`) plus one monomorphic `extern "C"` wrapper in `src/lib.rs`.

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

# Cargo's default release profile (`opt-level = 3`), with `panic = "abort"` (the engine rejects
# unwinding tables) and one codegen unit. sudo-rs's own release profile is `opt-level = "s"`,
# `lto = true`, unwinding panics; at `opt-level = "s"` (and "z") rustc 1.98.1 outlines
# `str::strip_prefix::<char>` and compares the prefix with a call to libc `bcmp`, which the proof
# would have to assume rather than check. At `opt-level = 2` and `3` the whole function is one
# self-contained block of 86 instructions (identical at 2 and 3).
[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false

[workspace]
